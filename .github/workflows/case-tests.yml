name: Static mowing regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q --ignore=tests/integration
      - run: python -m mower_pov cases validate scenarios/suites/static-v1.json
      - run: >-
          python -m mower_pov cases run scenarios/suites/static-smoke-v1.json
          --policy legacy-joint --no-render --jobs 2 --out runs/ci-static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-regression-evidence
          path: runs/ci-static
          if-no-files-found: ignore
